apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  labels:
    app: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: service-a:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_B_URL
              value: "http://service-b:8080/calculate"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://simplest-collector:4317"
            - name: ENVIRONMENT
              value: "dev"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,jaeger,service-a,service-b,simplest-collector"

---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  labels:
    app: service-a
spec:
  selector:
    app: service-a
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  labels:
    app: service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: service-b:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://simplest-collector:4317"
            - name: ENVIRONMENT
              value: "dev"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,jaeger,service-a,service-b,simplest-collector"

---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  labels:
    app: service-b
spec:
  selector:
    app: service-b
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080